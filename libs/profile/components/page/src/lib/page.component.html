<ng-container *contezzaLet="isMobile$ | async as isMobile">
    @if (isMobile) {
        <div style="padding: 0 24px; min-height: 48px">
            <button mat-icon-button (click)="toggleSidenav()">
                <mat-icon>menu</mat-icon>
            </button>
            {{ 'PROFILE.BROWSE.TITLE' | translate }}
        </div>
        <mat-tab-group
            class="contezza-profile"
            style="height: calc(100% - 40px)"
            [selectedIndex]="selectedIndex$ | async"
            (selectedTabChange)="onSelectedTabChange($event)"
            backgroundColor="primary"
            headerPosition="below"
        >
            @for (tab of tabs; track tab.id) {
                <mat-tab>
                    <ng-template mat-tab-label>
                        <mat-icon>{{ tab.icon }}</mat-icon>
                    </ng-template>
                    <contezza-profile-tab [tab]="tab" class="contezza-profile-tab" />
                </mat-tab>
            }
        </mat-tab-group>
    } @else {
        <mat-tab-group class="contezza-profile" [selectedIndex]="selectedIndex$ | async" (selectedTabChange)="onSelectedTabChange($event)" headerPosition="above">
            @for (tab of tabs; track tab.id) {
                <mat-tab label="{{ tab.label | translate }}">
                    <contezza-profile-tab [tab]="tab" class="contezza-profile-tab" />
                </mat-tab>
            }
        </mat-tab-group>
    }
</ng-container>
