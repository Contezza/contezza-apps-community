<div class="contezza-dynamic-form-filter">
    <div class="contezza-dynamic-form-filter-title" *ngIf="!hideTitle">
        {{ 'APP.FILTER.TITLE' | translate }}
    </div>

    <mat-card>
        <mat-card-content>
            <contezza-dynamic-form [dynamicForm]="dynamicForm" (keydown.enter)="searchClicked()"></contezza-dynamic-form>
            <div class="contezza-dynamic-form-filter-actions">
                <button mat-raised-button class="contezza-dynamic-form-filter-button" color="primary" (click)="clearFilters()">
                    <mat-icon style="margin-right: 10px">clear_all</mat-icon>{{ 'APP.FILTER.OPTIONS.CLEAR_ALL' | translate }}
                </button>
                <span class="adf-fill-remaining-space"></span>
                <button
                    *ngIf="dynamicForm?.queryMode === 'on-trigger'"
                    mat-raised-button
                    class="contezza-dynamic-form-filter-button"
                    color="primary"
                    (click)="searchClicked()"
                    [disabled]="!(dynamicForm.valid$ | async)"
                >
                    <mat-icon>search</mat-icon>{{ 'APP.FILTER.SEARCH_BUTTON' | translate }}
                </button>
            </div>
        </mat-card-content>
    </mat-card>
    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>
</div>
