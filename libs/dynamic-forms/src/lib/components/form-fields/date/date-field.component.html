<ng-container *contezzaLet="readonly$ | async as readonly">
    <mat-form-field
        class="contezza-form-field contezza-date-form-field adf-property-field adf-card-textitem-field"
        [class.mat-form-field-disabled]="readonly"
        [class.contezza-form-field-disabled]="readonly"
        floatLabel="auto"
        [appearance]="field.settings?.appearance"
    >
        <mat-label *ngIf="field.label">
            <ng-container *contezzaLet="field.label | translatePropertyTitle as label$">
                <ng-container *contezzaLet="label$ ? (label$ | async) : (field.label | translate) as label">{{ label }}</ng-container>
            </ng-container>
        </mat-label>
        <input
            #input
            matInput
            [matDatepicker]="picker"
            [formControl]="control"
            [placeholder]="field.placeholder | translate"
            (click)="onInputClick()"
            (focus)="onInputFocus()"
            (blur)="input.blur()"
            (focusout)="input.blur()"
            [required]="required"
            [readonly]="readonly"
            data-lpignore="true"
            autocomplete="off"
            class="adf-property-value"
            [min]="min$ | async"
            [max]="max$ | async"
        />
        <button
            mat-icon-button
            matSuffix
            class="contezza-form-field-clear"
            aria-label="Clear"
            *ngIf="!readonly && !control.disabled && control.value"
            tabindex="-1"
            (click)="clear($event)"
        >
            <mat-icon>cancel</mat-icon>
        </button>

        <mat-datepicker-toggle class="contezza-date-form-field-datepicker-toggle" matSuffix [for]="picker" tabindex="-1" />
        <mat-datepicker #picker [disabled]="readonly" />
        <mat-error contezza-dynamic-form-field-error *ngIf="field.validations?.length" [validations]="field.validations" [control]="control" />
    </mat-form-field>
</ng-container>
