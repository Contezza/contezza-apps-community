<ng-container *contezzaLet="readonly$ | async as readonly">
    <mat-form-field
        class="contezza-form-field contezza-select-form-field adf-property-field adf-card-textitem-field"
        [class.mat-form-field-disabled]="readonly"
        [class.contezza-form-field-disabled]="readonly"
        floatLabel="auto"
        [appearance]="field.settings?.appearance"
    >
        <mat-label *ngIf="field.label">{{ field.label | translate }}</mat-label>
        <mat-select
            #select
            [formControl]="control"
            [multiple]="field.type === 'multiselect'"
            (selectionChange)="control.markAsTouched()"
            [required]="required"
            [compareWith]="displayFn"
        >
            <mat-select-trigger *ngIf="select.value?.contezzaDisplay">
                <div title="{{ select.value?.contezzaDisplay.value.tooltip | translate }}">
                    <mat-icon *ngIf="select.value?.contezzaDisplay.value.icon" [contezzaIcon]="select.value?.contezzaDisplay.value.icon" />
                    {{ select.value?.contezzaDisplay.value.label || '' }}
                </div>
            </mat-select-trigger>
            <ng-container *contezzaLet="selectableOptions$ | async as options">
                <!--                <mat-option *ngIf="!field.disabledDefaultSelectOption && field.type === 'select'" [value]="'*'">{{ 'Alle' | translate }}</mat-option>-->
                <mat-checkbox
                    *ngIf="field.type === 'multiselect'"
                    class="checkbox mat-mdc-option contezza-option"
                    color="primary"
                    [checked]="control?.value?.length === options?.length"
                    [indeterminate]="control?.value?.length > 0 && control?.value?.length < options?.length"
                    (change)="setAll($event.checked); control.markAsTouched()"
                >
                    {{ 'APP.FORM_FIELDS.SELECT.SELECT_ALL' | translate }}
                </mat-checkbox>
                <mat-divider *ngIf="field.type === 'multiselect'" />
                <mat-option *ngFor="let option of options" [value]="option" title="{{ option.contezzaDisplay.option.tooltip | translate }}">
                    <mat-icon *ngIf="option.contezzaDisplay.option.icon" [contezzaIcon]="option.contezzaDisplay.option.icon" />
                    {{ option.contezzaDisplay.option.label || '' }}
                </mat-option>
            </ng-container>
        </mat-select>
        <button
            mat-icon-button
            matSuffix
            class="contezza-form-field-clear"
            aria-label="Clear"
            (click)="clear($event)"
            *ngIf="!required && !readonly && !control.disabled && control.value"
            tabindex="-1"
        >
            <mat-icon>cancel</mat-icon>
        </button>
        <button mat-icon-button aria-label="Open dropdown" matSuffix *ngIf="!readonly && !control.disabled">
            <mat-icon>arrow_drop_down</mat-icon>
        </button>
        <mat-error contezza-dynamic-form-field-error *ngIf="field.validations?.length" [validations]="field.validations" [control]="control" />
    </mat-form-field>
</ng-container>
