<ng-container *contezzaLet="readonly$ | async as readonly">
    <mat-checkbox
        [color]="field.settings?.color || 'primary'"
        class="mat-form-field contezza-form-field-checkbox"
        [formControl]="control"
        [labelPosition]="field.settings?.labelPosition"
        [disabled]="readonly"
    >
        <ng-container *contezzaLet="field.label && (field.label | translatePropertyTitle) as label$">
            <ng-container *contezzaLet="label$ ? (label$ | async) : (field.label | translate) as label">{{ label }}</ng-container>
        </ng-container>
    </mat-checkbox>
</ng-container>
