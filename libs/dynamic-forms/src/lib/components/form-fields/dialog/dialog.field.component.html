<ng-container *contezzaLet="readonly$ | async as readonly">
    <mat-form-field
        class="contezza-form-field contezza-dialog-form-field"
        [class.mat-form-field-disabled]="readonly"
        [class.contezza-form-field-disabled]="readonly"
        [floatLabel]="field.settings?.floatLabel"
        [appearance]="field.settings?.appearance"
    >
        <mat-label *ngIf="field.label">{{ field.label | translate }}</mat-label>

        <ng-container *ngIf="!settings?.multiple; else multiple">
            <input
                matInput
                type="text"
                spellcheck="false"
                [formControl]="control"
                [placeholder]="field.placeholder | translate"
                [required]="required"
                [readonly]="readonly"
                data-lpignore="true"
                [matAutocomplete]="auto"
                (focusin)="!readonly && openDialog$.next()"
            />
            <!-- fake autocomplete to use displayWith -->
            <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn" />
        </ng-container>

        <ng-template #multiple>
            <input
                matInput
                type="text"
                spellcheck="false"
                [formControl]="control"
                [placeholder]="field.placeholder | translate"
                [required]="required"
                [readonly]="readonly"
                data-lpignore="true"
                style="position: absolute; height: 0; color: transparent"
                (focusin)="!readonly && openDialog$.next()"
            />
            <mat-chip-set #chipList>
                <mat-chip *ngFor="let chip of control.value || []" (removed)="!readonly && remove(chip)">
                    {{ chip | apply : displayFn }}
                    <mat-icon matChipRemove>cancel</mat-icon>
                </mat-chip>
            </mat-chip-set>
        </ng-template>

        <button
            type="button"
            mat-icon-button
            matSuffix
            class="adf-property-clear-value contezza-form-field-clear"
            aria-label="Clear"
            *ngIf="!readonly && !control.disabled && control.value"
            tabindex="-1"
            (click)="clear($event)"
        >
            <mat-icon>cancel</mat-icon>
        </button>
        <mat-error contezza-dynamic-form-field-error *ngIf="field.validations?.length || control.errors" [validations]="field.validations" [control]="control" />
    </mat-form-field>
</ng-container>
