<mat-form-field class="ontezza-form-field contezza-date-time-form-field" floatLabel="auto" [appearance]="field.settings?.appearance">
    <mat-label>{{ field.label | translate }}</mat-label>
    <input
        #input
        matInput
        [matDatetimepicker]="picker"
        [formControl]="control"
        [placeholder]="field.placeholder | translate"
        (blur)="input.blur()"
        (focusout)="input.blur()"
        [required]="required"
        data-lpignore="true"
        autocomplete="off"
        class="adf-property-value"
        [min]="min$ | async"
        [max]="max$ | async"
    />
    <button
        mat-icon-button
        matSuffix
        class="contezza-form-field-clear"
        aria-label="Clear"
        *ngIf="!readonly && !control.disabled && control.value"
        tabindex="-1"
        (click)="clear($event)"
    >
        <mat-icon>cancel</mat-icon>
    </button>

    <mat-datetimepicker-toggle class="mat-datepicker-toggle" matSuffix [for]="picker" />
    <mat-datetimepicker #picker type="datetime" [timeInterval]="5" />
    <mat-error contezza-dynamic-form-field-error *ngIf="field.validations?.length" [validations]="field.validations" [control]="control" />
</mat-form-field>
