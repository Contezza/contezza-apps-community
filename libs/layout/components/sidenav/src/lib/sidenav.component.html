<ng-container *ngIf="mode$ | async as mode">
    <ng-container *ngIf="createActions$ | async as createActions">
        <ng-container *ngIf="createActions.length">
            <contezza-create-menu class="contezza-sidenav-create-menu" [mode]="mode" [actions]="createActions"></contezza-create-menu>
        </ng-container>
    </ng-container>

    <ng-container *ngIf="isMobile$ | async">
        <contezza-sidenav-header class="contezza-mobile-sidenav-header"></contezza-sidenav-header>
    </ng-container>

    <contezza-navbar class="contezza-sidenav-navbar" [mode]="$any(mode)" [groups]="(groups$ | async) || []"></contezza-navbar>
</ng-container>
