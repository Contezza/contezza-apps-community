<ng-container *ngIf="mode === 'expanded'">
    <button mat-raised-button color="primary" data-automation-id="create-button" [matMenuTriggerFor]="rootMenu" title="{{ 'APP.HEADER.BUTTONS.CREATE_TOOLTIP' | translate }}">
        <span class="contezza-create-menu-label">
            <span>{{ 'APP.HEADER.BUTTONS.CREATE' | translate }}</span>
            <mat-icon title="{{ 'APP.HEADER.BUTTONS.CREATE_TOOLTIP' | translate }}">arrow_drop_down</mat-icon>
        </span>
    </button>
</ng-container>

<ng-container *ngIf="mode !== 'expanded'">
    <button
        mat-icon-button
        color="primary"
        class="contezza-create-menu--collapsed"
        data-automation-id="create-button"
        [matMenuTriggerFor]="rootMenu"
        #createMenu="matMenuTrigger"
        title="{{ 'APP.HEADER.BUTTONS.CREATE_TOOLTIP' | translate }}"
    >
        <mat-icon class="contezza-create-menu--icon" title="{{ 'APP.HEADER.BUTTONS.CREATE_TOOLTIP' | translate }}">queue</mat-icon>
    </button>
</ng-container>

<mat-menu #rootMenu="matMenu" role="menu" class="contezza-create-menu__root-menu contezza-create-menu__sub-menu">
    <ng-container *ngFor="let action of actions; trackBy: trackByActionId">
        <app-toolbar-menu-item [actionRef]="action" />
    </ng-container>
</mat-menu>
