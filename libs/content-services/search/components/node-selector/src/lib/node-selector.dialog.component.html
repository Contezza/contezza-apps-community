<div mat-dialog-title>{{ data.title | translate }}</div>

<mat-dialog-content>
    <contezza-search-table-layout [settings]="settings" />
</mat-dialog-content>

<mat-dialog-actions class="adf-dialog-buttons contezza-search-node-selector-dialog-actions">
    <mat-chip-listbox class="contezza-search-node-selector-dialog-actions-selection">
        <mat-chip-option *ngFor="let node of selectedNodes" [removable]="true" (removed)="removeNode(node)">
            {{ node.entry.name }}
            <mat-icon matChipRemove>cancel</mat-icon>
        </mat-chip-option>
    </mat-chip-listbox>

    <span class="adf-fill-remaining-space"></span>

    <button mat-button mat-dialog-close="">
        {{ 'APP.BUTTONS.CANCEL' | translate }}
    </button>

    <button mat-raised-button color="primary" [disabled]="!selectedNodes?.length" [mat-dialog-close]="this.data.multiple ? selectedNodes : selectedNodes[0]">
        {{ 'APP.BUTTONS.OK' | translate }}
    </button>
</mat-dialog-actions>
