<ng-container *ngIf="data$ | async as data">
    <ng-container *ngIf="column.data?.withSelection && (isSelected$ | async); else thumbnail">
        <mat-icon class="contezza-thumbnail-column-selected" svgIcon="selected" />
    </ng-container>
    <ng-template #thumbnail>
        <span
            [class]="data.class || ''"
            [style]="data.style || ''"
            [matBadge]="data.badge"
            [matTooltip]="data.tooltip || '' | translate"
            matTooltipClass="contezza-thumbnail-column-tooltip"
        >
            <ng-container *ngIf="data.icon.startsWith('./assets'); else icon">
                <img style="vertical-align: middle" [src]="data.icon" alt="" />
            </ng-container>
            <ng-template #icon>
                <mat-icon [contezzaIcon]="data.icon" />
            </ng-template>
        </span>
    </ng-template>
</ng-container>
