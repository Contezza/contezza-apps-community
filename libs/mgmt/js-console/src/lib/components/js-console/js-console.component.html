<div class="js-console">
    <aca-page-layout>
        <aca-page-layout-header class="tezza-div">
            <contezza-js-console-header (toggleScriptListOpenState)="showScriptsList = $event" />
        </aca-page-layout-header>

        <aca-page-layout-content>
            <div class="aca-main-content">
                <div class="flex-container">
                    <div class="flex-item">
                        <contezza-js-console-content />
                    </div>
                    <div class="grabber" contezzaResizer>
                        <mat-progress-bar *ngIf="executeScriptLoading$ | async" mode="indeterminate" />
                    </div>
                    <div class="flex-item">
                        <contezza-js-console-output class="js-console-output" />
                    </div>
                </div>
            </div>

            <div class="aca-sidebar" *ngIf="showScriptsList">
                <contezza-js-console-scripts-list />
            </div>
        </aca-page-layout-content>
    </aca-page-layout>
</div>
